name: fixit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # Auth & Backend
  appwrite: 24.2.0
  google_sign_in: ^7.2.0

  # UI
  cached_network_image: ^3.4.1
  fl_chart: ^0.71.0
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  lottie: ^3.1.2
  flutter_markdown: ^0.7.7+1
  flutter_staggered_animations: ^1.0.1

  # Video
  video_player: ^2.11.1
  chewie: ^1.13.1

  # Maps & Location
  google_maps_flutter: 2.7.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Utils
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.14.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: any
  uuid: ^4.5.3
  equatable: ^2.0.8
  logger: ^2.7.0

  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^21.0.0
  shared_preferences: ^2.5.5
  flutter_staggered_grid_view: ^0.7.0
  app_links: 7.0.0
  flutter_web_auth_2: 5.0.2
  device_info_plus: 12.4.0
  google_maps_flutter_android: 2.12.0
  connectivity_plus: ^7.1.1
  package_info_plus: ^9.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  excel: ^4.0.5
  share_plus: ^10.1.3
  flutter_secure_storage: ^10.3.1
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1
  flutter_jailbreak_detection: ^1.10.0
  shake: ^3.0.0
  mocktail: ^1.0.5
  flutter_localizations:
    sdk: flutter
  # flutter_facebook_auth removed as we use Appwrite OAuth2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  dart_appwrite: 14.0.0
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  assets:
    - assets/images/
    - assets/data/vietnam_provinces.json
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_foreground_inset: 10
